name: Context contract
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, 'codex/context-discovery']
jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml
      - run: python -B -m pytest product/tests -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -B product/scripts/lfg.py generate --check
      - run: python -B product/scripts/update_template_hashes.py --check
      - name: Bash lifecycle smoke
        if: runner.os != 'Windows'
        run: |
          bash product/tests/smoke_install.sh
          bash product/tests/smoke_update.sh
      - name: PowerShell lifecycle smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE/product/tests/smoke_install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/product/tests/smoke_update.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
